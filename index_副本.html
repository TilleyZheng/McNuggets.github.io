    let particles = [];

    // ==================== 初始化 ====================
    function initClouds() {
      clouds = [];
      for (let i = 0; i < 5; i++) {
        clouds.push({
          x: Math.random() * W,
          y: 40 + Math.random() * 120,
          w: 50 + Math.random() * 60,
          speed: 0.3 + Math.random() * 0.5
        });
      }
    }

    function initGame(resetScore = true) {
      bird.y = H / 2 - 50;
      bird.vy = 0;
      bird.rotation = 0;
      bird.wingFrame = 0;
      obstacles = [];
      obstacleTimer = 0;
      particles = [];
      if (resetScore) {
        score = 0;
        reviveCount = 0;
      }
      initClouds();
      updateLivesDisplay();
    }

    initClouds();

    // ==================== 绘制函数 ====================
    function drawPixelRect(x, y, w, h, color) {
      ctx.fillStyle = color;
      ctx.fillRect(Math.floor(x), Math.floor(y), w, h);
    }

    function drawPixelCircle(cx, cy, r, color) {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fill();
    }

    // 绘制背景
    function drawBackground() {
      // 天空渐变
      const grad = ctx.createLinearGradient(0, 0, 0, H - GROUND_H);
      grad.addColorStop(0, COLORS.bgTop);
      grad.addColorStop(1, COLORS.bg);
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H);

      // 云朵
      ctx.fillStyle = COLORS.cloud;
      for (const c of clouds) {
        ctx.fillRect(c.x, c.y, c.w, 16);
        ctx.fillRect(c.x + 8, c.y - 10, c.w - 20, 12);
        ctx.fillRect(c.x + 16, c.y - 6, c.w - 32, 8);
      }

      // 远景装饰 - 麦当劳拱门剪影
      ctx.fillStyle = '#F0E68C';
      ctx.fillRect(50, H - GROUND_H - 50, 8, 50);
      ctx.fillRect(90, H - GROUND_H - 50, 8, 50);
      ctx.fillRect(50, H - GROUND_H - 58, 48, 8);

      ctx.fillRect(280, H - GROUND_H - 40, 6, 40);
      ctx.fillRect(310, H - GROUND_H - 40, 6, 40);
      ctx.fillRect(280, H - GROUND_H - 46, 36, 6);

      // 地面
      ctx.fillStyle = COLORS.ground;
      ctx.fillRect(0, H - GROUND_H, W, GROUND_H);
      ctx.fillStyle = COLORS.groundLight;
      ctx.fillRect(0, H - GROUND_H, W, 6);

      // 地面条纹
      ctx.fillStyle = '#C41E14';
      for (let i = 0; i < W; i += 30) {
        const offset = (Date.now() / 20) % 30;
        ctx.fillRect(i - offset, H - GROUND_H + 10, 15, 4);
        ctx.fillRect(i - offset + 5, H - GROUND_H + 24, 15, 4);
        ctx.fillRect(i - offset + 2, H - GROUND_H + 38, 15, 4);
      }
    }

    // 绘制像素风麦乐鸡
    function drawNugget(b) {
      const x = Math.floor(b.x);
      const y = Math.floor(b.y);
      const px = 2; // 像素大小

      ctx.save();
      ctx.translate(x + b.w / 2, y + b.h / 2);
      ctx.rotate(b.rotation);
      ctx.translate(-(x + b.w / 2), -(y + b.h / 2));

      // 麦乐鸡主体（不规则形状用像素块拼）
      const nuggetPixels = [
        '  XXXXXX  ',
        ' XXXXXXXX ',
        'XXXXXXXXXX',
        'XXXXXXXXXX',
        ' XXXXXXXX ',
        '  XXXXXX  ',
        '   XXXX   '
      ];

      for (let row = 0; row < nuggetPixels.length; row++) {
        const line = nuggetPixels[row];
        for (let col = 0; col < line.length; col++) {
          if (line[col] === 'X') {
            // 颜色变化模拟烤色
            let color = COLORS.nugget;
            if ((row + col) % 3 === 0) color = COLORS.nuggetCrust;
            if ((row + col) % 5 === 0) color = COLORS.nuggetDark;
            drawPixelRect(x + col * px, y + row * px + 2, px, px, color);
          }
        }
      }

      // 眼睛
      drawPixelRect(x + 16, y + 10, 4, 4, '#000');
      drawPixelRect(x + 17, y + 10, 2, 2, '#FFF');

      // 嘴巴
      drawPixelRect(x + 20, y + 14, 6, 3, '#FF6B35');

      // 翅膀（动画）
      const wingY = b.wingFrame === 0 ? y + 14 : (b.wingFrame === 1 ? y + 12 : y + 16);
      drawPixelRect(x - 4, wingY, 8, 6, COLORS.nuggetCrust);
      drawPixelRect(x - 2, wingY + 1, 6, 4, COLORS.nugget);

      ctx.restore();
    }

    // 绘制薯条障碍物
    function drawFryObstacle(obs) {
      const x = obs.x;
      const w = OBSTACLE_W;

      // 上面的薯条盒子
      if (obs.topH > 0) {
        const topY = obs.topH - 180;
        // 盒子主体
        drawPixelRect(x + 4, topY, w - 8, 180, COLORS.fryBox);
        // 盒子暗面
        drawPixelRect(x + w - 12, topY, 8, 180, COLORS.fryBoxDark);
        // 盒子边框
        drawPixelRect(x + 4, topY + 170, w - 8, 4, COLORS.pipeBorder);
        // 薯条露头
        for (let i = 0; i < 5; i++) {
          const fx = x + 8 + i * 10;
          const fh = 18 + (i % 3) * 8;
          drawPixelRect(fx, obs.topH - fh, 6, fh, COLORS.fry);
          drawPixelRect(fx + 1, obs.topH - fh, 2, fh, COLORS.fryDark);
        }
        // 麦当劳标志（简化的M）
        ctx.fillStyle = '#FFC72C';
        ctx.font = 'bold 14px monospace';
        ctx.fillText('M', x + w / 2 - 6, topY + 100);
      }

      // 下面的薯条盒子
      const gapBottom = obs.topH + OBSTACLE_GAP;
      const bottomH = H - GROUND_H - gapBottom;
      if (bottomH > 0) {
        // 盒子主体
        drawPixelRect(x + 4, gapBottom, w - 8, bottomH, COLORS.fryBox);
        // 盒子暗面
        drawPixelRect(x + w - 12, gapBottom, 8, bottomH, COLORS.fryBoxDark);
        // 盒子顶部边框
        drawPixelRect(x + 4, gapBottom, w - 8, 4, COLORS.pipeBorder);
        // 薯条露头
        for (let i = 0; i < 5; i++) {
          const fx = x + 8 + i * 10;
          const fh = 16 + (i % 3) * 6;
          drawPixelRect(fx, gapBottom, 6, fh, COLORS.fry);
          drawPixelRect(fx + 1, gapBottom, 2, fh, COLORS.fryDark);
        }
        // 麦当劳标志
        ctx.fillStyle = '#FFC72C';
        ctx.font = 'bold 14px monospace';
        ctx.fillText('M', x + w / 2 - 6, gapBottom + bottomH / 2 + 5);
      }
    }

    // 绘制分数
    function drawScore() {
      ctx.fillStyle = COLORS.score;
      ctx.font = 'bold 28px "Courier New", monospace';
      ctx.textAlign = 'center';
      ctx.fillText(score.toString(), W / 2, 50);

      // 分数阴影
      ctx.fillStyle = 'rgba(0,0,0,0.1)';
      ctx.fillText(score.toString(), W / 2 + 2, 52);

      ctx.textAlign = 'left';
    }

    // 绘制开始菜单
    function drawMenu() {
      drawBackground();

      // 标题
      ctx.fillStyle = '#DA291C';
      ctx.font = 'bold 26px "Courier New", monospace';
      ctx.textAlign = 'center';
      ctx.fillText('飞天麦乐鸡', W / 2, 160);

      ctx.fillStyle = '#B8860B';
      ctx.font = 'bold 36px "Courier New", monospace';
      ctx.fillText('McNugget', W / 2, 200);

      // 麦乐鸡图标
      bird.x = W / 2 - 17;
      bird.y = 250;
      bird.rotation = Math.sin(Date.now() / 300) * 0.1;
      bird.wingFrame = Math.floor(Date.now() / 150) % 3;
      drawNugget(bird);

      // 提示
      ctx.fillStyle = '#8B4513';
      ctx.font = '16px "Courier New", monospace';
      ctx.fillText('按空格键或点击开始', W / 2, 340);
      ctx.fillText('帮助麦乐鸡飞过薯条!', W / 2, 370);

      // 最高分
      ctx.fillStyle = '#DA291C';
      ctx.font = '14px "Courier New", monospace';
      ctx.fillText('最高分: ' + highScore, W / 2, 420);

      ctx.textAlign = 'left';
    }

    // 绘制粒子
    function drawParticles() {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        if (p.life <= 0) {
          particles.splice(i, 1);
          continue;
        }
        ctx.globalAlpha = p.life / p.maxLife;
        drawPixelRect(p.x, p.y, p.size, p.size, p.color);
        ctx.globalAlpha = 1;
      }
    }

    function addParticles(x, y, color, count = 8) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 4,
          vy: (Math.random() - 0.5) * 4,
          life: 20 + Math.random() * 15,
          maxLife: 35,
          size: 2 + Math.random() * 3,
          color
        });
      }
    }

    // ==================== 游戏逻辑 ====================
    function spawnObstacle() {
      const minH = 60;
      const maxH = H - GROUND_H - OBSTACLE_GAP - minH;
      const topH = minH + Math.random() * (maxH - minH);
      obstacles.push({
        x: W,
        topH,
        passed: false
      });
    }

    function updateObstacles() {
      for (let i = obstacles.length - 1; i >= 0; i--) {
        const obs = obstacles[i];
        obs.x -= OBSTACLE_SPEED;

        // 计分
        if (!obs.passed && obs.x + OBSTACLE_W < bird.x) {
          obs.passed = true;
          score++;
          addParticles(bird.x + 20, bird.y, '#FFC72C', 6);
        }

        // 移除屏幕外的障碍物
        if (obs.x + OBSTACLE_W < -20) {
          obstacles.splice(i, 1);
        }
      }
    }

    function updateClouds() {
      for (const c of clouds) {
        c.x -= c.speed;
        if (c.x + c.w < -20) {
          c.x = W + 20;
          c.y = 40 + Math.random() * 120;
        }
      }
    }

    function checkCollision() {
      const bx = bird.x + 6;
      const by = bird.y + 4;
      const bw = bird.w - 12;
      const bh = bird.h - 8;

      // 地面碰撞
      if (by + bh >= H - GROUND_H) {
        return true;
      }

      // 天花板碰撞
      if (by < -10) {
        return true;
      }

      // 障碍物碰撞
      for (const obs of obstacles) {
        const ox = obs.x + 4;
        const ow = OBSTACLE_W - 8;

        // 上面盒子
        if (obs.topH > 0) {
          if (bx < ox + ow && bx + bw > ox && by < obs.topH) {
            return true;
          }
        }

        // 下面盒子
        const gapBottom = obs.topH + OBSTACLE_GAP;
        const bottomH = H - GROUND_H - gapBottom;
        if (bottomH > 0) {
          if (bx < ox + ow && bx + bw > ox && by + bh > gapBottom) {
            return true;
          }
        }
      }

      return false;
    }

    function gameOver() {
      state = 'dead';
      bird.vy = 0;
      lastDeathX = bird.x;

      // 死亡粒子
      addParticles(bird.x + bird.w / 2, bird.y + bird.h / 2, '#D4A035', 20);

      if (score > highScore) {
        highScore = score;
        localStorage.setItem('mcd_flappy_high', highScore);
        document.getElementById('recordValue').textContent = highScore;
      }

      setTimeout(() => {
        if (state === 'dead') {
          showRevivePanel();
        }
      }, 500);
    }

    function showRevivePanel() {
      const panel = document.getElementById('revivePanel');
      const content = document.getElementById('reviveContent');

      let html = '';
      if (reviveCount < MAX_REVIVE) {
        if (reviveCount === 0) {
          html += '<button class="revive-btn primary" id="btnAdRevive">🍟 观看麦当劳广告复活</button>';
        } else {
          html += '<button class="revive-btn primary" id="btnShareRevive">📤 邀请好友助力复活</button>';
        }
      }
      html += '<button class="revive-btn tertiary" id="btnEndGame">结束游戏</button>';

      content.innerHTML = html;
      panel.style.display = 'block';
      state = 'revive';

      // 绑定按钮事件
      setTimeout(() => {
        const btnAd = document.getElementById('btnAdRevive');
        const btnShare = document.getElementById('btnShareRevive');
        const btnEnd = document.getElementById('btnEndGame');

        if (btnAd) btnAd.onclick = onAdRevive;
        if (btnShare) btnShare.onclick = onShareRevive;
        if (btnEnd) btnEnd.onclick = onEndGame;
      }, 10);
    }

    function hideRevivePanel() {
      document.getElementById('revivePanel').style.display = 'none';
    }

    // 广告复活
    function onAdRevive() {
      hideRevivePanel();
      state = 'ad';
      const overlay = document.getElementById('adOverlay');
      const countdownEl = document.getElementById('adCountdown');
      overlay.style.display = 'flex';

      let count = 3;
      countdownEl.textContent = count;

      const timer = setInterval(() => {
        count--;
        countdownEl.textContent = count;
        if (count <= 0) {
          clearInterval(timer);
          overlay.style.display = 'none';
          reviveCount++;
          updateLivesDisplay();
          showContinueButton();
        }
      }, 1000);
    }

    // 分享复活
    function onShareRevive() {
      // 模拟复制链接
      const shareText = `我在「麦当劳飞天麦乐鸡」中得了${score}分！快来挑战吧！`;
      if (navigator.clipboard) {
        navigator.clipboard.writeText(shareText).catch(() => {});
      }
      showToast('已复制分享链接！');

      hideRevivePanel();
      reviveCount++;
      updateLivesDisplay();
      showContinueButton();
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.style.display = 'block';
      setTimeout(() => {
        toast.style.display = 'none';
      }, 2000);
    }

    function showContinueButton() {
      state = 'continue_wait';
      const btn = document.getElementById('continueBtn');
      btn.style.display = 'block';
      btn.onclick = () => {
        btn.style.display = 'none';
        startContinueCountdown();
      };
    }

    function startContinueCountdown() {
      const overlay = document.getElementById('adOverlay');
      const text = overlay.querySelector('.ad-text');
      const countdown = document.getElementById('adCountdown');
      let count = 3;

      text.textContent = '即将继续游戏';
      countdown.textContent = count;
      overlay.style.display = 'flex';

      const timer = setInterval(() => {
        count--;
        if (count > 0) {
          countdown.textContent = count;
          return;
        }

        clearInterval(timer);
        overlay.style.display = 'none';
        continueGame();
      }, 1000);
    }

    function continueGame() {
      // 重置鸟的状态
      bird.vy = 0;
      bird.y = H / 2 - 50;
      bird.rotation = 0;
      bird.wingTimer = 0;

      // 清理鸟周围的障碍物，避免立即再次死亡
      obstacles = obstacles.filter(obs => obs.x + OBSTACLE_W < bird.x - 40 || obs.x > bird.x + 80);

      state = 'playing';
    }

    function onEndGame() {
      hideRevivePanel();
      showFinalPanel();
    }

    function showFinalPanel() {
      state = 'final';
      const panel = document.getElementById('finalPanel');
      document.getElementById('finalScore').textContent = score;

      const rewards = [
        { threshold: 50, name: '麦乐鸡侠券', description: '多一块麦乐鸡', icon: '🐔' },
        { threshold: 100, name: '薯条升级券', description: '薯条升级', icon: '🍟' },
        { threshold: 200, name: '免费甜筒券', description: '免费甜筒', icon: '🍦' },
        { threshold: 300, name: '免费汉堡券', description: '免费汉堡', icon: '🍔' }
      ];
      const earnedReward = rewards.reduce((current, reward) => score >= reward.threshold ? reward : current, null);
      const nextReward = rewards.find(reward => score < reward.threshold);

      document.getElementById('couponIcon').textContent = earnedReward ? earnedReward.icon : '🎫';
      document.getElementById('couponName').textContent = earnedReward
        ? `${earnedReward.name}（${earnedReward.description}）`
        : '加油，再试一次！';
      document.getElementById('nextCouponValue').textContent = nextReward
        ? `${nextReward.threshold}分 - ${nextReward.name}（${nextReward.description}）`
        : '已解锁全部奖励';

      const couponList = document.getElementById('couponList');
      couponList.replaceChildren(...rewards.map(reward => {
        const item = document.createElement('li');
        item.textContent = `${reward.threshold}分 - ${reward.name}（${reward.description}）`;
        return item;
      }));

      panel.style.display = 'block';

      document.getElementById('restartBtn').onclick = () => {
        panel.style.display = 'none';
        initGame(true);
        state = 'menu';
      };
    }

    function updateLivesDisplay() {
      const el = document.getElementById('livesDisplay');
      const remaining = MAX_REVIVE - reviveCount;
      el.textContent = '❤️'.repeat(remaining) + '🖤'.repeat(reviveCount);
    }

    // ==================== 主循环 ====================
    function gameLoop() {
      if (state === 'menu') {
        drawMenu();
      } else if (state === 'playing') {
        // 物理更新
        bird.vy += bird.gravity;
        bird.y += bird.vy;

        // 旋转
        if (bird.vy < 0) {
          bird.rotation = -0.3;
        } else {
          bird.rotation = Math.min(Math.PI / 4, bird.rotation + 0.05);
        }

        // 翅膀动画
        bird.wingTimer++;
        if (bird.wingTimer > 8) {
          bird.wingTimer = 0;
          bird.wingFrame = (bird.wingFrame + 1) % 3;
        }

        // 障碍物生成
        obstacleTimer++;
        if (obstacleTimer >= obstacleInterval) {
          obstacleTimer = 0;
          spawnObstacle();
        }

        updateObstacles();
        updateClouds();

        // 碰撞检测
        if (checkCollision()) {
          gameOver();
        }

        // 绘制
        drawBackground();
        for (const obs of obstacles) {
          drawFryObstacle(obs);
        }
        drawNugget(bird);
        drawParticles();
        drawScore();

      } else if (state === 'dead') {
        // 死亡瞬间保持画面
        drawBackground();
        for (const obs of obstacles) {
          drawFryObstacle(obs);
        }
        // 死亡时麦乐鸡下坠
        if (bird.y < H - GROUND_H - bird.h) {
          bird.vy += bird.gravity;
          bird.y += bird.vy;
          bird.rotation += 0.1;
        }
        drawNugget(bird);
        drawParticles();
        drawScore();

      } else if (state === 'revive' || state === 'continue_wait' || state === 'final') {
        // 保持背景但不更新物理
        drawBackground();
        for (const obs of obstacles) {
          drawFryObstacle(obs);
        }
        drawNugget(bird);
        drawScore();
      }

      requestAnimationFrame(gameLoop);
    }

    // ==================== 输入处理 ====================
    function jump() {
      if (state === 'menu') {
        initGame(true);
        state = 'playing';
        bird.vy = bird.jump;
        if (WRAP.requestFullscreen && !document.fullscreenElement) {
          WRAP.requestFullscreen().catch(() => {});
        }
      } else if (state === 'playing') {
        bird.vy = bird.jump;
        bird.wingFrame = 1;
        bird.wingTimer = 0;
      }
    }

    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        jump();
      }
    });

    canvas.addEventListener('mousedown', (e) => {
      e.preventDefault();
      jump();
    });

    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      jump();
    }, { passive: false });

    document.getElementById('fullscreenExit').addEventListener('click', (e) => {
      e.stopPropagation();
      if (document.fullscreenElement) {
        document.exitFullscreen().catch(() => {});
      }
    });

    // 防止页面滚动
    document.addEventListener('touchmove', (e) => {
      e.preventDefault();
    }, { passive: false });

    // 启动
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
